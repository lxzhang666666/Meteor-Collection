name: CI # 工作流名称

# master 分支发生 push 时触发
on:
  push:
    branches:
      - master

env: # 设置环境变量
  TZ: Asia/Shanghai # 时区（设置时区可使页面中的最近更新时间使用时区时间）

jobs:
  deploy:
    runs-on: ubuntu-latest # 运行环境为最新版的 Ubuntu

    strategy:
      matrix:
        node-version: [14.x] # 使用 Node.js 14.x 版本

    steps:
      # 步骤1：拉取代码（拉取完整历史，确保 git log 能正常工作）
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false # 不持久化 Git 凭证
          fetch-depth: 0 # 拉取所有 commit 历史

      # 步骤2：配置 Git 用户信息
      - name: Configure Git
        run: |
          git config --global user.name "lxzhang666666"
          git config --global user.email "1870287706@qq.com"
          git config --global credential.helper ""
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      # 步骤3：检查本次 push 的 commit message 是否包含 [deploy] 标记
      - name: Check deploy marker
        id: check
        run: |
          # 找出本次 push 新增的 commit（与 origin/master 的对比范围）
          NEW_COMMITS=$(git log origin/master..HEAD --pretty=format:'%s' 2>/dev/null)
          # 若对比失败（首次 push），则取最近 10 条作为备选
          if [ -z "$NEW_COMMITS" ]; then
            NEW_COMMITS=$(git log --pretty=format:'%s' -10 2>/dev/null)
          fi
          echo "New commit messages:"
          echo "$NEW_COMMITS"
          # 检查 message 中是否包含 [deploy] 标记
          if echo "$NEW_COMMITS" | grep -q '\[deploy\]'; then
            echo "trigger=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到 [deploy] 标记，开始构建部署"
          else
            echo "trigger=false" >> $GITHUB_OUTPUT
            echo "⏭️ 未检测到 [deploy] 标记，跳过部署"
          fi

      # 步骤4：安装 Node.js（仅在有 [deploy] 标记时执行）
      - name: Use Node.js
        if: steps.check.outputs.trigger == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # 步骤5：安装依赖并构建静态文件（仅在有 [deploy] 标记时执行）
      - name: Install & Build
        if: steps.check.outputs.trigger == 'true'
        run: |
          npm install
          npm run build

      # 步骤6：部署到 gh-pages 分支（仅在有 [deploy] 标记时执行）
      - name: Deploy to gh-pages
        if: steps.check.outputs.trigger == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: npm run deploy
