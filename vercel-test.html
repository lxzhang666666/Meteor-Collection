<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vercel 测试页面</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }
    .status {
      display: inline-block;
      padding: 10px 20px;
      background: #4CAF50;
      border-radius: 25px;
      font-weight: bold;
      margin: 20px 0;
    }
    .info {
      margin-top: 30px;
      font-size: 1.1em;
      opacity: 0.9;
    }
    .timestamp {
      margin-top: 20px;
      font-size: 0.9em;
      opacity: 0.7;
    }
    a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 Vercel 部署成功！</h1>
    <div class="status">✅ API 服务正常运行</div>
    <div class="info">
      <p>这是 Vercel 静态测试页面</p>
      <p>如果你能看到这个页面，说明 Vercel 部署成功</p>
      <p style="margin-top: 20px;">
        <a href="/api/test">点击查看 API 测试端点</a>
      </p>
    </div>
    <div class="timestamp" id="timestamp"></div>
  </div>

  <script>
    document.getElementById('timestamp').textContent =
      '页面加载时间: ' + new Date().toLocaleString('zh-CN');
  </script>
</body>
</html>
